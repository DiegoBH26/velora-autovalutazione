name: Velora - Contratti rete 12 agenti
on:
  push:
    branches: [main]
    paths:
      - 'velora_agent_network.py'
      - 'velora_portal_sessions.py'
      - 'local_audit_server.py'
      - 'AGGIORNA_VELORA_COMPLETO.bat'
      - 'src/App.tsx'
      - 'tests/test_velora_specialists_contract.py'
      - '.github/workflows/velora-specialists.yml'
  workflow_dispatch:

jobs:
  specialist-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run offline contract tests
        run: python -m unittest discover -s tests -p 'test_velora_specialists_contract.py' -v
