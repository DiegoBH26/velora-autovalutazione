name: Validate Velora

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Validate Chrome Companion JavaScript
        run: |
          node --check chrome-companion-expedia/background.js
          node --check chrome-companion-expedia/bridge.js
          node tests/test_expedia_companion_grid.cjs
          node tests/test_expedia_companion_geometry.cjs
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile local agent
        run: python -m py_compile local_audit_server.py site_audit_builder.py browser_audit_pilot.py booking_engine.py mass_scrape.py
      - name: Check Expedia companion contracts
        run: python -m unittest discover -s tests -p 'test_expedia_chrome_companion.py'
