name: Deploy Velora to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Verify Chrome Companion syntax and room grid
        run: |
          node --check chrome-companion-expedia/background.js
          node --check chrome-companion-expedia/bridge.js
          node tests/test_expedia_companion_grid.cjs
          node tests/test_expedia_companion_geometry.cjs
          node tests/test_expedia_companion_tall_cards.cjs
          node tests/test_vrbo_companion.cjs
          node tests/test_holidu_companion.cjs
          node tests/test_three_ota_tabs.cjs
          node tests/test_five_ota_companion.cjs
          node tests/test_ota_asymmetry_matrix.cjs
          node tests/test_wrong_ota_listing_quarantine.cjs
      - name: Package Chrome Companion into downloadable ZIP
        run: |
          python -c "import pathlib,zipfile; root=pathlib.Path('chrome-companion-expedia'); dest=pathlib.Path('dist/velora-expedia-companion.zip'); z=zipfile.ZipFile(dest,'w',zipfile.ZIP_DEFLATED); [z.write(p,arcname='Velora_Chrome_Companion/'+p.name) for p in sorted(root.iterdir()) if p.is_file() and p.suffix in ('.json','.js','.txt')]; z.close(); print('Prepared',dest)"
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile local audit agent
        run: python -m py_compile local_audit_server.py site_audit_builder.py browser_audit_pilot.py booking_engine.py mass_scrape.py velora_agent_network.py velora_direct_commercial.py velora_direct_stays.py velora_shared_intelligence.py velora_portal_sessions.py
      - name: Regression Leonardo and shared specialist evidence
        run: python -m unittest discover -s tests -p 'test_leonardo_shared_audit.py'
      - name: Validate specialist agent metadata and legacy protections
        run: python -m unittest discover -s tests -p 'test_agent_*.py'
      - name: Check Expedia companion contracts
        run: python -m unittest discover -s tests -p 'test_expedia_chrome_companion.py'
      - name: Check corrected structure identity and specialist protection
        run: python -m unittest discover -s tests -p 'test_specialist_identity_lock_v125.py'
      - name: Verify Booking identity regression
        run: python -m unittest discover -s tests -p 'test_booking_exact_identity.py'
      - name: Verify Booking-first OTA date locks
        run: python -m unittest discover -s tests -p 'test_booking_date_lock_contract.py'
      - name: Verify selected calendar range and unique Booking stays
        run: python -m unittest discover -s tests -p 'test_booking_date_range_regression.py'
      - name: Verify Agoda room grid and sold-out safeguards
        run: python -m unittest discover -s tests -p 'test_agoda_rate_grid_regression.py'
      - name: Verify exact Agoda rates and Airbnb exclusion memory
        run: python -m unittest discover -s tests -p 'test_specolizzi_agoda_airbnb_regressions.py'
      - name: Verify manual OTA search reports and agent chat
        run: python -m unittest discover -s tests -p 'test_manual_ota_presence.py'
      - name: Check private agent mailbox and Giove handoffs
        run: python -m unittest discover -s tests -p 'test_agent_mailbox_contract.py'
      - name: Check Giove agent chat viewer
        run: python -m unittest discover -s tests -p 'test_giove_agent_chat.py'
      - name: Check agent collaboration and recovery
        run: python -m unittest discover -s tests -p 'test_agent_collaboration_contract.py'
      - name: Execute live peer dialogue unit tests
        run: python -m unittest discover -s tests -p 'test_specialist_live_peer_dialog.py'
      - name: Validate Specolizzi / Airbnb brand boundary
        run: python -m unittest discover -s tests -p 'test_specolizzi_name_alias.py'
      - name: Verify OTA dashboard and evidence flow
        run: python -m unittest discover -s tests -p 'test_ota_dashboard_v126.py'
      - name: Verify Vrbo autonomous presence and 3-OTA workspace
        run: python -m unittest discover -s tests -p 'test_vrbo_presence_and_ota_workspace.py'
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
